<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheBlaze · Singer, Songwriter and Performer</title>
<meta name="description" content="TheBlaze (Tiarra Hayes): singer, songwriter and performer. Book live entertainment for your event.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== 1. THEME: colours and fonts from the business card. Change them here only. ===== */
:root{--navy:#080a26;--indigo:#1d2f9a;--violet:#4a2294;--gold:#d9ae55;--gold-hi:#f4d98f;--yellow:#f2e23a;--plate-tx:#14123a;
--tx:#ece8f6;--dim:#b9b3d4;--line:rgba(217,174,85,.3);--disp:"Cormorant Garamond",Georgia,serif;--ui:Manrope,system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ===== 2. BASE ===== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;color:var(--tx);font:400 1.05rem/1.7 var(--ui);overflow-x:hidden;
background:radial-gradient(85% 55% at 90% 0,var(--violet) 0,transparent 62%) fixed,radial-gradient(70% 55% at 0 60%,#1d2f9acc 0,transparent 65%) fixed,var(--navy)}
a{color:inherit}:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
h2{font:700 clamp(2.4rem,7vw,4.2rem)/1.05 var(--disp);color:var(--gold-hi);margin:0 0 1.2rem}
.sec{max-width:1150px;margin:0 auto;padding:6rem 1.4rem}
.row{display:flex;gap:1rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.8rem 1.7rem;border:1.5px solid var(--gold);color:var(--gold-hi);text-decoration:none;font:700 1rem var(--ui);background:none;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:var(--gold);color:var(--plate-tx)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--plate-tx)}.btn.pri:hover{background:#fff}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.rv.on{opacity:1;transform:none}

/* ===== 3. NAV ===== */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.4rem;background:rgba(8,10,38,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav b{font:700 1.5rem var(--disp);color:var(--gold-hi)}nav div{display:flex;gap:1.5rem;align-items:center;font-size:.92rem}
nav a{text-decoration:none;color:var(--tx)}nav a:hover{color:var(--gold-hi)}nav .btn{padding:.4rem 1.1rem;color:var(--plate-tx)}
@media(max-width:700px){nav div a:not(.btn){display:none}}

/* ===== 4. HERO ===== */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden}
.hero .bg{position:absolute;inset:0}.hero .bg video{width:100%;height:100%;object-fit:cover;opacity:.45}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,38,.9),rgba(8,10,38,.15))}
.portrait{position:absolute;right:-4%;bottom:0;height:92%;width:auto;max-width:none;pointer-events:none;mask-image:linear-gradient(0deg,transparent 0,#000 12%);-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 12%);filter:drop-shadow(0 0 50px rgba(110,80,255,.4));animation:pin 2s ease both}
@keyframes pin{from{opacity:0;transform:translateY(20px)}}
.hero .in{position:relative;width:100%;max-width:1150px;margin:0 auto;padding:7rem 1.4rem 5rem}
.eq{display:flex;gap:8px;align-items:flex-end;height:64px;margin-bottom:1.4rem}
.eq i{width:9px;height:var(--a);background:repeating-linear-gradient(0deg,#fff 0 5px,transparent 5px 9px);animation:eq 2.6s ease-in-out infinite;animation-delay:calc(var(--n)*-.41s)}
@keyframes eq{50%{height:var(--b)}}
.hero h1{font:700 clamp(3.8rem,15vw,10rem)/.95 var(--disp);margin:.2rem 0;background:linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 60%,#a77a2c);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.plate{display:inline-block;background:var(--yellow);color:var(--plate-tx);font:700 clamp(1.05rem,2.6vw,1.35rem) var(--disp);padding:.25rem 1.2rem}
@media(max-width:760px){.portrait{right:50%;transform:translateX(50%);height:62%;opacity:.4;animation:none}}

/* ===== 5. ABOUT ===== */
.about{display:grid;gap:3rem;align-items:center}@media(min-width:800px){.about{grid-template-columns:.85fr 1.3fr}}
.arch{aspect-ratio:3/4;max-width:400px;width:100%;justify-self:center;overflow:hidden;border-radius:999px 999px 20px 20px;border:2px solid var(--gold);box-shadow:0 0 90px -24px var(--violet);background:var(--navy)}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.about p{font:500 clamp(1.3rem,2.6vw,1.7rem)/1.5 var(--disp);margin:0 0 1rem;max-width:34em}
.tags{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem}.tags span{border:1px solid var(--line);padding:.2rem .9rem;font-size:.9rem;color:var(--gold-hi)}

/* ===== 6. SERVICES ===== */
.intro{max-width:44em;color:var(--dim);margin:0 0 2.2rem}

/* ===== 7. REEL, MUSIC, SHOWS, GALLERY (hidden until content is added) ===== */
.song{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.1rem 0;border-top:1px solid var(--line);text-decoration:none}.song b{font:700 clamp(1.5rem,4vw,2.3rem) var(--disp);color:var(--gold-hi)}.song small{color:var(--dim)}
.show{display:grid;grid-template-columns:5rem 1fr auto;gap:1rem;align-items:center;padding:1.2rem 0;border-top:1px solid var(--line)}.show .d{font:700 2.2rem/1 var(--disp);color:var(--gold-hi);text-align:center}.show .d small{display:block;font:600 .8rem var(--ui);color:var(--dim)}.show h3{margin:0;font:700 1.4rem var(--disp)}.show p{margin:0;color:var(--dim)}
.strip{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:1rem}.strip figure{flex:0 0 min(70vw,300px);margin:0;scroll-snap-align:start}.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line)}.strip figcaption{color:var(--dim);font-size:.9rem;margin-top:.4rem}

/* ===== 8. CONTACT ===== */
.contact{display:grid;gap:3rem}@media(min-width:800px){.contact{grid-template-columns:1fr 1fr}}
.det{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem 1.5rem}.det span{display:block;font-size:.85rem;color:var(--dim)}.det a,.det b{font:700 1.1rem var(--disp);color:var(--gold-hi);text-decoration:none;word-break:break-all}
form{display:grid;gap:1.2rem;background:rgba(8,10,38,.6);border:1px solid var(--line);padding:1.8rem}
label{display:grid;gap:.2rem;font-size:.85rem;color:var(--dim)}
input,select,textarea{font:400 1.05rem var(--ui);color:var(--tx);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:.5rem 0;width:100%;border-radius:0}
select option{color:#111}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yellow)}
footer{text-align:center;padding:3rem 1.4rem 4rem;color:var(--dim);font-size:.9rem;border-top:1px solid var(--line)}footer b{display:block;font:700 1.6rem var(--disp);color:var(--gold-hi)}
/* ===== 9. SPARK: the lively touches. Delete any block to remove that effect. ===== */
#wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 340px at var(--mx,72%) var(--my,40%),rgba(244,217,143,.17),transparent 70%)}
.portrait{translate:calc(var(--px,0)*-22px) calc(var(--py,0)*-14px);transition:translate .25s ease-out}
.hero h1{background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 150% 0/250% 100% no-repeat,linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 60%,#a77a2c);-webkit-background-clip:text;background-clip:text;animation:shine 7s ease-in-out 1.5s infinite}
@keyframes shine{0%{background-position:150% 0,0 0}40%,100%{background-position:-50% 0,0 0}}
.band{position:relative;z-index:3;background:var(--yellow);color:var(--plate-tx);overflow:hidden;white-space:nowrap;border-block:2px solid var(--plate-tx);transform:rotate(-1.2deg);margin:-1.6rem -3% 0}
.band div{display:inline-block;padding:.55rem 0;font:700 clamp(1.2rem,3vw,1.7rem) var(--disp);animation:mq 40s linear infinite}
.band span{margin:0 1.4rem}.band span::after{content:"●";margin-left:2.8rem;font-size:.6em;vertical-align:middle}
@keyframes mq{to{transform:translateX(-25%)}}
#pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:100%;background:var(--yellow);transform:scaleX(0);transform-origin:left;z-index:30}
.arch{animation:breathe 6s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 0 130px -8px var(--violet)}}
/* ===== 10. LANDING VIDEO: one looping video behind the name, same layout on phone and desktop ===== */
.hero.hasvid{align-items:flex-end}.hasvid .in{padding-bottom:5.5rem}
.hasvid .bg video{opacity:1}
.hasvid .bg::after{background:linear-gradient(0deg,rgba(8,10,38,.95) 4%,rgba(8,10,38,.45) 50%,rgba(8,10,38,.2)),linear-gradient(90deg,rgba(8,10,38,.55),transparent 70%)}

/* ===== 11. PERFORMANCES: a swipeable reel of film frames, opens in a full-screen player ===== */
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}.arrows{display:flex;gap:.6rem;margin-bottom:1.2rem}@media(max-width:700px){.arrows{display:none}}
.arrows .btn{padding:.4rem 1rem}
.reels{display:flex;gap:1.4rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.5rem 1.4rem 1.2rem;margin:0 -1.4rem;scroll-padding:0 1.4rem}
.reel-card{flex:0 0 min(84vw,440px);scroll-snap-align:start;display:block;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit;text-decoration:none}
.frame{position:relative;background:#05061a;padding:20px 0;border:1px solid var(--line)}
.frame::before,.frame::after{content:"";position:absolute;left:0;right:0;height:9px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 10px,transparent 10px 22px)}
.frame::before{top:5px}.frame::after{bottom:5px}
.pt{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(135deg,var(--violet),var(--indigo))}
.pt img,.pt video{width:100%;height:100%;object-fit:cover;display:block}
.pt::after{content:"\25B6";position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:var(--yellow);color:var(--plate-tx);display:grid;place-items:center;font-size:1.1rem;padding-left:3px;transition:transform .3s}
.reel-card:hover .pt::after{transform:scale(1.15)}
.reel-card h3{font:700 1.5rem var(--disp);color:var(--gold-hi);margin:.8rem 0 0}.reel-card p{margin:0;color:var(--dim);font-size:.9rem}
#vm{position:fixed;inset:0;z-index:60;background:rgba(5,6,24,.94);display:none;place-items:center;padding:1rem}#vm.on{display:grid}
#vm video{width:min(94vw,1000px);max-height:78vh;background:#000;border:2px solid var(--gold)}
#vm .btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1rem);right:1rem;color:var(--tx);background:rgba(8,10,38,.85)}
/* ===== 12. SIGNATURE: the equalizer bars from her card are a playable instrument ===== */
.eqw{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}.eqw .eq{margin:0;touch-action:none;user-select:none;-webkit-user-select:none}
.eq i{width:14px;cursor:pointer;position:relative;transition:filter .2s}
.eq i::before{content:"";position:absolute;left:-4px;right:-4px;bottom:0;height:64px}
.eq i.hit{background:repeating-linear-gradient(0deg,var(--yellow) 0 5px,transparent 5px 9px);filter:drop-shadow(0 0 10px var(--yellow))}
.eq i:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.hint{font:italic 500 1.15rem var(--disp);color:var(--gold-hi);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
/* ===== 13. DIGITAL BUSINESS CARD: her real card as a flippable, tilting 3D object (front and back, with a scan-to-save-contact QR). ===== */
.cardwrap{position:relative;z-index:2;margin:1.8rem 0 2rem;perspective:1200px}
.card3d{container-type:inline-size;width:min(88vw,400px);aspect-ratio:7/4;animation:cardIn 1.2s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) rotateX(28deg)}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .25s ease-out}.inner.flipping{transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#0a0d33;border:1px solid var(--gold);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 70px -15px var(--violet);font-family:var(--disp);color:var(--gold)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,0%),rgba(255,255,255,.2),transparent 55%)}
.back{transform:rotateY(180deg)}
.front{display:grid;grid-template-columns:62% 38%}
.fl{position:relative;padding:5.5cqw 0 3cqw 5cqw;display:flex;flex-direction:column;gap:1.5cqw;overflow:hidden}
.cpl{background:var(--yellow);color:#14123a;font-weight:700;font-size:5cqw;padding:1.6cqw 2.5cqw 1.6cqw 5cqw;margin-left:-5cqw;line-height:1.15}
.crole{font-weight:700;font-size:4.1cqw;color:var(--gold);margin-top:1cqw}
.cs{font-weight:700;font-size:3.3cqw;color:var(--gold);text-decoration:none;line-height:1.3}
.cline{font-weight:700;font-size:3.2cqw;color:var(--yellow);text-decoration:underline;line-height:1.3;margin-top:1.2cqw}
.cphone{font-weight:700;font-size:3.5cqw;color:#f6f1e6;text-decoration:none}
.art{position:relative;background:linear-gradient(160deg,#2c1f86,#5a2f9d)}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bb{position:absolute;left:5cqw;right:5cqw;top:5cqw;height:25cqw;display:flex;gap:2.6cqw;align-items:flex-end}
.bb i{flex:1;background:repeating-linear-gradient(0deg,#f6f1e6 0 2.6cqw,transparent 2.6cqw 4cqw)}
.bname{position:absolute;left:5cqw;top:33cqw;font-weight:700;font-size:5.4cqw;color:var(--gold)}
.bbar{position:absolute;left:0;top:41cqw;width:66cqw;background:var(--yellow);color:#14123a;padding:1.6cqw 3cqw 1.6cqw 5cqw;font-weight:700;font-size:4.2cqw;line-height:1.35;display:flex;flex-direction:column}.bbar a{color:inherit;text-decoration:none}
.qr{position:absolute;right:5cqw;top:31cqw;width:20cqw;text-align:center}.qr svg{display:block;width:100%;border:1cqw solid #fff;background:#fff}
.qr small{display:block;font:700 2.8cqw var(--ui);color:var(--gold);margin-top:1cqw;letter-spacing:.08em}
.flipbtn{margin-top:.9rem;padding:.4rem 1.1rem;background:rgba(8,10,38,.7)}
/* ===== 14. CONTACT: soft, romantic details (rose petals, sparkles, an invitation-style form). Delete this block for a plainer look. ===== */
:root{--rose:#f0b6c4;--rose-d:#d98fa3}
.contact-wrap{position:relative}.contact-wrap .contact{position:relative;z-index:1;align-items:start}
.petals{position:absolute;inset:0 -4vw;overflow:hidden;pointer-events:none}
.petal{position:absolute;top:-30px;left:var(--x);width:calc(14px*var(--s));height:calc(18px*var(--s));background:linear-gradient(135deg,#f9d3dc,var(--rose-d));border-radius:150% 0 150% 0;animation:fall var(--d) linear var(--l) infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:.5}50%{transform:translate(46px,380px) rotate(200deg)}88%{opacity:.5}100%{transform:translate(-24px,760px) rotate(380deg);opacity:0}}
.orn{color:var(--rose);letter-spacing:.7em;font-size:1rem;margin-bottom:.5rem;animation:tw 3.5s ease-in-out infinite}@keyframes tw{50%{opacity:.45}}
.script{font:italic 500 clamp(1.5rem,3.2vw,2.1rem)/1.2 var(--disp);color:var(--rose);margin:-.5rem 0 1rem}
.det span{color:var(--rose)}
form{position:relative;border-radius:22px;border:1px solid rgba(240,182,196,.45);background:linear-gradient(160deg,rgba(240,182,196,.12),rgba(8,10,38,.65) 55%);box-shadow:0 0 0 6px rgba(8,10,38,.55),0 0 0 7px rgba(240,182,196,.22),0 30px 70px -30px #000}
form::before{content:"\273F";position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--rose);padding:0 .8rem;font-size:1.4rem;line-height:1}
form .btn.pri{border-radius:99px;background:linear-gradient(90deg,var(--yellow),#f6d68a);border-color:transparent}
form input:focus,form select:focus,form textarea:focus{border-color:var(--rose)}
@media(prefers-reduced-motion:reduce){.petal{display:none}}
/* ===== 15. EDITORIAL LOOK: the visuals lead, headings are small numbered labels. Delete this block to go back to big headings. ===== */
.sec{padding:4.8rem 1.4rem}
.sec h2{font:600 .78rem/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-hi);margin:0 0 1.6rem}
.intro{font-size:.95rem;max-width:34em;margin:0 0 1.8rem}
nav{background:linear-gradient(rgba(8,10,38,.75),transparent);border-bottom:0;backdrop-filter:none;padding:1.1rem 1.6rem}
nav b{font:700 .8rem var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--tx)}
nav div{gap:2.2rem;font:600 .72rem var(--ui);letter-spacing:.18em;text-transform:uppercase}
nav .btn,nav .btn.pri{background:none;border:0;padding:0;color:var(--yellow);text-decoration:underline;text-underline-offset:6px}
.avail{position:absolute;right:1.6rem;bottom:2.6rem;z-index:3;display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--tx)}
.avail span{font:500 4.2rem/1 var(--disp);color:var(--gold-hi)}.avail b{font:700 .75rem/1.35 var(--ui);letter-spacing:.2em;text-transform:uppercase;text-align:center}
@media(max-width:700px){.avail{display:none}}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(5,1fr)}
@media(max-width:899px){.tiles{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -1.4rem;padding:0 1.4rem;scroll-padding:0 1.4rem}.tile{flex:0 0 74vw;scroll-snap-align:start}}
.tile{position:relative;aspect-ratio:3/4.3;overflow:hidden;background:#0a0d33}
.tart{position:absolute;inset:0;background:radial-gradient(70% 55% at 30% 20%,hsl(var(--h) 70% 48%/.9),transparent 70%),radial-gradient(60% 50% at 80% 92%,hsl(calc(var(--h) + 40) 75% 44%/.75),transparent 70%),#0a0d33;transition:transform .9s}
.tart::after{content:"";position:absolute;inset:auto 0 0 0;height:62%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 6px,transparent 6px 16px);-webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent)}
.tart img,.tart video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.tile:hover .tart{transform:scale(1.08)}
.tcap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:3rem 1rem 1rem;background:linear-gradient(transparent,rgba(5,6,24,.92))}
.tcap h3{margin:0 0 .3rem;font:700 .8rem/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#fff}.tcap p{margin:0;font-size:.82rem;line-height:1.45;color:var(--dim)}
.reel-card{flex-basis:min(88vw,640px)}
.reel-card h3{font:600 .78rem var(--ui);letter-spacing:.16em;text-transform:uppercase;margin:.8rem 0 0;color:#fff}
.arch{max-width:520px}.about p{font-size:clamp(1.1rem,1.7vw,1.35rem);line-height:1.6}
.about{gap:3.5rem}@media(min-width:800px){.about{grid-template-columns:1.05fr 1fr}}
.tags span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.script{font-size:clamp(1.7rem,4vw,2.7rem)}
html,body{overflow-x:clip}main{overflow-x:clip}.sec{overflow-x:clip}.band{max-width:100vw}
.hasart .tart{background:linear-gradient(0deg,rgba(5,6,24,.4),transparent 55%),var(--art) var(--pos,50% 20%)/var(--zoom,240%) no-repeat,#0a0d33;filter:hue-rotate(var(--hr,0deg)) saturate(1.1)}.hasart .tart::after{display:none}
@media(min-width:900px){.tile{aspect-ratio:3/5}}
/* ===== 16. LANDING SPARK: stage beams that follow the pointer and twinkling gold dust. Delete this block to remove. ===== */
.hero .row{margin-top:1.9rem}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.beam{position:absolute;top:-8%;width:34vw;min-width:240px;height:118%;transform-origin:50% 0;mix-blend-mode:screen;opacity:.24;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);transform:rotate(calc(var(--base) + var(--tilt,0deg)));transition:transform .9s ease-out;animation:sway 11s ease-in-out infinite alternate}
.b1{left:4%;--base:14deg;background:linear-gradient(180deg,#ffe9b0,transparent 80%)}

UtDTyH+QdnY5mFwHwz4/6EH7DGju3nrcAAAAAAA=",
             paragraphs: ["I’m Tiarra Hayes, a singer, songwriter and performer, known on stage as TheBlaze. Music is how I tell stories, and every performance is a chance to make a room feel something.",
                          "Whether it’s an intimate gathering or a packed venue, I bring the same energy, warmth and care to every event, so your night feels personal and memorable."],
             tags: ["Singer", "Songwriter", "Live performer"] },
  services:{ title: "Services", intro: "From the first note to the final encore, I create the atmosphere your guests will talk about long after the night ends.",
             items: [{ title: "Weddings and receptions", text: "Live vocals to set the mood for your ceremony, first dance and celebration." },
                     { title: "Private parties", text: "Birthdays, anniversaries and gatherings with a performance made just for your guests." },
                     { title: "Corporate and community events", text: "Polished, professional entertainment for galas, launches, fundraisers and festivals." },
                     { title: "Concerts and venues", text: "Full live sets for stages, restaurants, lounges and special engagements." },
                     { title: "Collaborations", text: "Writing, recording and performing with other artists, producers and creators." }] },

  const back = h("div", { class: "face back" }, h("div", { class: "bb" }, bars), h("div", { class: "bname" }, c.backName),
    h("div", { class: "bbar" }, h("a", { href: tel }, s.contact.phone), h("a", { href: "mailto:" + s.contact.email }, s.contact.email)), h("div", { class: "qr" }, svg, h("small", {}, c.scan)));
  const inner = h("div", { class: "inner" }, front, back), card = h("div", { class: "card3d", role: "group", "aria-label": "Business card" }, inner);
  const btn = h("button", { class: "btn flipbtn", type: "button", "aria-pressed": "false" }, "Flip the card \u21bb");
  let flipped = false, rx = 0, ry = 0; const apply = () => { inner.style.transform = `rotateX(${rx}deg) rotateY(${(flipped ? 180 : 0) + ry}deg)`; };
  card.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    ry = (x - .5) * 18; rx = -(y - .5) * 14; card.style.setProperty("--gx", x * 100 + "%"); card.style.setProperty("--gy", y * 100 + "%"); apply(); });

/* Hero extras: soft sound waves that follow the pointer, a moving light and a gentle portrait parallax. */
function startWave(cv, hero) {
  const cx = cv.getContext("2d"), cols = ["150,110,255,.35", "217,174,85,.5", "110,140,255,.3", "244,217,143,.4", "150,110,255,.28"];
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches; let W, H, mx = -999, my = 0, on = false, run = false;
  const size = () => { const d = Math.min(devicePixelRatio || 1, 1.5); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener("resize", size);
  hero.addEventListener("pointermove", e => { const r = hero.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top;
    hero.style.setProperty("--mx", mx + "px"); hero.style.setProperty("--my", my + "px");
    hero.style.setProperty("--px", (mx / r.width - .5).toFixed(2)); hero.style.setProperty("--py", (my / r.height - .5).toFixed(2)); });
  const draw = ms => { const t = ms / 3000; cx.clearRect(0, 0, W, H);
    cols.forEach((c, r) => { const cy = H * (.25 + .14 * r), amp = H * .05; cx.beginPath();
      for (let x = 0; x <= W + 10; x += 10) { const g = Math.exp(-((x - mx) ** 2) / (2 * 160 * 160));
        const y = cy + Math.sin(x / W * (3 + r * .5) * 2 + t * (1 + r * .15) + r) * amp + Math.sin(x / W * 9 - t + r) * amp * .3 + g * (my - cy) * .18;
        x ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.strokeStyle = `rgba(${c})`; cx.lineWidth = 1.3; cx.stroke(); }); };
  const loop = ms => { draw(ms); if (on && !still) requestAnimationFrame(loop); else run = false; };
  new IntersectionObserver(([e]) => { on = e.isIntersecting; if (on && !run) { run = true; requestAnimationFrame(loop); } }).observe(hero);
}

/* Signature touch: the equalizer bars are a playable instrument. Notes are from a pentatonic scale, so any tune sounds good. Silent until tapped. */
function makeInstrument(eq) {
  if (!eq) return;
  const notes = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5]; let ac, out, last;
  const setup = () => { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain();
    const dl = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain(); dl.delayTime.value = .28; fb.gain.value = .32; wet.gain.value = .35;
    out.connect(ac.destination); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination); };
  const play = b => { if (!ac) setup(); if (ac.state === "suspended") ac.resume();
    const f = notes[+b.dataset.k], t = ac.currentTime, g = ac.createGain(), g2 = ac.createGain(), o = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = "sine"; o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f * 2; lfo.frequency.value = 5.5; lg.gain.value = f * .006; lfo.connect(lg); lg.connect(o.frequency);
    g2.gain.value = .18; o2.connect(g2); g2.connect(g); o.connect(g);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .04); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8); g.connect(out);
    [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + 1.9); });
    b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 420); const hint = document.querySelector(".hint"); if (hint) hint.remove(); };
  eq.addEventListener("pointerdown", e => { const b = e.target.closest("i"); if (b) { last = b; play(b); } });
  eq.addEventListener("pointermove", e => { if (!(e.buttons & 1)) return; const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest && el.closest(".eq i"); if (b && b !== last) { last = b; play(b); } });
  eq.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("i")) { e.preventDefault(); play(e.target); } });
}

function init(s) {

  if (s.about && s.about.image) { document.documentElement.classList.add("hasart"); document.documentElement.style.setProperty("--art", `url("${s.about.image}")`); }
  const app = document.getElementById("app"), links = []; const heroEl = renderHero(s); heroEl.addEventListener("pointermove", e => heroEl.style.setProperty("--tilt", ((e.clientX / innerWidth - .5) * 16).toFixed(1) + "deg")); heroEl.append(h("a", { class: "avail", href: "#contact", "aria-label": "Book your event" }, h("span", {}, "("), h("b", {}, "Book your", h("br"), "event"), h("span", {}, ")"))); app.append(heroEl);
  SECTIONS.forEach(sc => { const el = sc.render(s); if (el) { app.append(el); if (sc.nav) links.push(sc); } });
  const wv = document.getElementById("wave"); if (wv) startWave(wv, document.getElementById("top")); makeInstrument(document.querySelector(".eq"));
  const pg = h("div", { id: "pg" }); document.body.append(pg);
  addEventListener("scroll", () => { pg.style.transform = `scaleX(${Math.min(1, scrollY / Math.max(1, document.body.scrollHeight - innerHeight))})`; }, { passive: true });
  const nav = document.getElementById("nav"); nav.append(h("b", {}, s.brand.name),
    h("div", {}, links.filter(l => l.nav !== "Contact").map(l => h("a", { href: "#" + l.id }, l.nav)), h("a", { class: "btn pri", href: "#contact" }, "Book me")));
  document.getElementById("foot").append(h("b", {}, s.brand.name), `${s.brand.legal} · ${s.brand.role} · © ${new Date().getFullYear()}`);
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("on")), { threshold: .12 });
  document.querySelectorAll(".rv").forEach(n => io.observe(n));
